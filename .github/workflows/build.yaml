name: Build and publish

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: JSON build matrix produced by scripts/check-releases.sh
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-builds
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Validate the build matrix
        id: matrix
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MATRIX: ${{ inputs.matrix }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Release builds must run from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          value="$(jq -ce '
            if type != "array" or length == 0 then error("matrix must be a non-empty array") else . end
            | if all(.[];
                ((.jool_version | type) == "string" and (.jool_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) and
                ((.kernel_abi | type) == "string" and (.kernel_abi | test("^[0-9][0-9A-Za-z.+~_-]*$"))) and
                ((.debian_suite | type) == "string" and (.debian_suite | length > 0)) and
                ((.debian_release | type) == "string" and (.debian_release | test("^[0-9]+$"))) and
                (.architecture == "amd64" or .architecture == "arm64") and
                (.kernel_release == (.kernel_abi + "-cloud-" + .architecture)) and
                (.headers_package == ("linux-headers-" + .kernel_release))
              ) then . else error("invalid matrix entry") end
            | if (map(.jool_version) | unique | length) == 1 then . else error("mixed Jool versions") end
            | . as $matrix
            | if ($matrix | group_by(.kernel_abi) | all(.[];
                length == 2 and (map(.architecture) | sort) == ["amd64", "arm64"]
              )) then $matrix else error("each kernel ABI must contain exactly amd64 and arm64") end
          ' <<<"$MATRIX")"
          echo "value=$value" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:trixie-slim
    steps:
      - name: Install action runtime dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            bash ca-certificates coreutils curl findutils gettext-base git grep libgcc-s1 libstdc++6 sed tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, validate, package, and inventory modules
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          scripts/build.sh \
            --jool-version "${{ matrix.jool_version }}" \
            --kernel-abi "${{ matrix.kernel_abi }}" \
            --kernel-release "${{ matrix.kernel_release }}" \
            --architecture "${{ matrix.architecture }}" \
            --headers-package "${{ matrix.headers_package }}" \
            --output output

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the module archive
        run: scripts/sign.sh output/*.tar.gz

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jool-${{ matrix.kernel_abi }}-${{ matrix.architecture }}
          path: output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output
          pattern: jool-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: scripts/publish.sh --repository "$GITHUB_REPOSITORY" --matrix "$MATRIX" --assets output
