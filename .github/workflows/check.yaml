name: Check for builds

on:
  schedule:
    # run every 6 hours on minute 17
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: check-for-builds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for an active build workflow
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yaml \
            --limit 100 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length')"
          if (( active > 0 )); then
            echo "A build workflow is already active; nothing to do."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.active.outputs.skip != 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Discover missing builds
        if: steps.active.outputs.skip != 'true'
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jool_version="$(scripts/discover-jool.sh)"
          scripts/discover-kernels.sh trixie:13 >kernels.json
          scripts/check-releases.sh \
            --repository "$GITHUB_REPOSITORY" \
            --jool-version "$jool_version" \
            --kernels kernels.json >matrix.json

          echo "Jool $jool_version"
          jq . matrix.json
          {
            echo "jool_version=$jool_version"
            echo "matrix=$(jq -c . matrix.json)"
            echo "count=$(jq length matrix.json)"
          } >>"$GITHUB_OUTPUT"

      - name: Start the build workflow
        if: steps.active.outputs.skip != 'true' && steps.discover.outputs.count != '0'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ steps.discover.outputs.matrix }}
        run: |
          gh workflow run build.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            --field matrix="$MATRIX"
